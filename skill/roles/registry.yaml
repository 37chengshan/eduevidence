roles:
  research-planner:
    responsibility: framing completeness and scope
    stages: [frame]
    capabilities: [research_framing]
    critical_path: true
  evidence-retriever:
    responsibility: source acquisition and provenance
    stages: [retrieve]
    capabilities: [literature_search, counter_evidence_search, source_fetch, source_validation]
  evidence-analyst:
    responsibility: structured finding extraction
    stages: [extract]
    capabilities: [study_extraction, finding_extraction, claim_linking]
  skeptic:
    responsibility: independent counter-evidence coverage
    stages: [challenge]
    capabilities: [counter_evidence_search]
    independence_required: different-model-family
    critical_path: true
  method-reviewer:
    responsibility: methodology and construct-validity appraisal
    stages: [audit]
    capabilities: [methodology_appraisal]
    independence_required: role-separation
    critical_path: true
  evidence-judge:
    responsibility: evidence-bounded adjudication and applicability
    stages: [adjudicate, applicability]
    capabilities: [evidence_synthesis, tribunal, applicability_analysis, knowledge_gap_detection]
    critical_path: true
  intervention-designer:
    responsibility: grounded intervention or pilot design
    stages: [intervene]
    capabilities: [study_design, measurement_design, intervention_design]
  evaluation-designer:
    responsibility: estimable evaluation and update logic
    stages: [evaluate]
    capabilities: [evaluation_design, data_validation, data_analysis]

execution:
  max_parallel_workers: 6
  split_by: evidence_axis
  single_writer: lead-orchestrator
  recursive_swarm: false
