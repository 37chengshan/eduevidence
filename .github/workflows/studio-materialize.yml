name: Materialize Studio source
on:
  pull_request:
    paths: ['.studio-import/**', '.github/workflows/studio-materialize.yml']
permissions:
  contents: write
jobs:
  materialize:
    if: github.head_ref == 'feature/research-studio-redesign' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and materialize authored source patch
        run: |
          python - <<'PY'
          import base64, hashlib, lzma, subprocess
          from pathlib import Path
          chunks=sorted(Path('.studio-import').glob('payload-*.b64'))
          assert len(chunks)==8
          patch=lzma.decompress(base64.b64decode(''.join(p.read_text() for p in chunks),validate=True))
          assert hashlib.sha256(patch).hexdigest()=='c4772fd2868690955a7ad182377273bf9b51cd42b4fa6c2377a62df38ce7b217'
          Path('/tmp/studio.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','/tmp/studio.patch'],check=True)
          subprocess.run(['git','apply','--whitespace=fix','/tmp/studio.patch'],check=True)
          PY
          git rm -r .studio-import
          git restore --source=HEAD --staged --worktree -- .github
          rm -f .github/workflows/studio.yml
      - name: Lock patched dependencies and format source
        run: |
          npm install --prefix studio
          npm install --prefix studio --save-dev --save-exact prettier@3.6.2 @playwright/test@1.55.1
          studio/node_modules/.bin/prettier --write 'studio/src/**/*.{ts,tsx,css}' 'studio/tests/*.ts' 'studio/*.ts' 'studio/*.json' 'studio/*.html' 'studio/public/*.json' 'studio/scripts/*.mjs' visualization/eduevidence-report/assets/reader.css visualization/eduevidence-report/assets/reader.js
          mkdir -p /tmp/studio-completed
          npm audit --prefix studio --json > /tmp/studio-completed/npm-audit.json || true
          npm audit --prefix studio --audit-level=high
      - name: Build and verify
        run: |
          npm run build --prefix studio
          python scripts/generate_metrics.py
          git diff --exit-code -- .github integrations/agent_mcp.py benchmarks schemas references/scientific-invariants.md web/landing.html
          git diff --check
      - name: Commit completed source and static distribution
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: rebuild read-only Research Studio and five-theme report reading'
          git archive HEAD --format=tar.gz -o /tmp/studio-completed/source.tar.gz
      - name: Push only the authorized feature branch
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha }}'
          current=$(git ls-remote https://github.com/37chengshan/eduevidence.git refs/heads/feature/research-studio-redesign | cut -f1)
          test "$current" = "$expected"
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push https://github.com/37chengshan/eduevidence.git HEAD:refs/heads/feature/research-studio-redesign
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: studio-completed-source
          path: /tmp/studio-completed/*
          retention-days: 7
