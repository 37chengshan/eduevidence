# CI for EduEvidence - independent jobs run on every PR and push to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]' ruff pytest-cov
      - name: Version consistency gate
        run: python scripts/check_version_consistency.py
      - name: Metrics gate
        run: python scripts/generate_metrics.py --check
      - name: Ruff (E9/F63/F7/F82)
        run: ruff check --select E9,F63,F7,F82 .
      - name: Run tests with coverage
        run: |
          python -m pytest --cov=engine --cov=retrieval \
            --cov-report=term-missing:skip-covered --cov-report=xml --tb=short
      - name: Wheel install smoke
        run: |
          python -m pip wheel . -w /tmp/wheelbuild --no-deps
          python -m pip install /tmp/wheelbuild/*.whl --target /tmp/wheel-smoke --no-deps
          cd /tmp
          PYTHONPATH=/tmp/wheel-smoke python - <<'PY'
          from pathlib import Path
          from engine import ENGINE_VERSION
          import eduevidence_cli
          import engine.autoevolve
          import engine.autoresearch
          import engine.citation_check
          import integrations.orchestration_dispatch
          import retrieval.search

          root = Path('/tmp/wheel-smoke').resolve()
          modules = (
              eduevidence_cli,
              engine.autoevolve,
              engine.autoresearch,
              engine.citation_check,
              integrations.orchestration_dispatch,
              retrieval.search,
          )
          for module in modules:
              path = Path(module.__file__).resolve()
              assert path.is_relative_to(root), f'{module.__name__} imported from source tree: {path}'
          print('isolated wheel smoke OK', ENGINE_VERSION)
          PY

  schema-smoke:
    name: schema-smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate current complete example packs against schema contracts
        run: |
          set -euo pipefail
          validate() { python scripts/validate_schema.py --schema "$1" --data "$2"; }
          for pack in ai-tutor ai-writing-assistant ai-coding-assistant-evidence; do
            validate schemas/verdict.schema.json         "examples/$pack/verdict.json"
            validate schemas/evidence.schema.json        "examples/$pack/evidence.jsonl"
            validate schemas/intervention.schema.json    "examples/$pack/intervention.json"
            validate schemas/methodology.schema.json     "examples/$pack/methodology.json"
            validate schemas/education-frame.schema.json "examples/$pack/frame.json"
            validate schemas/evaluation.schema.json      "examples/$pack/evaluation.json"
            validate schemas/report-result.schema.json   "examples/$pack/result.json"
          done
          validate schemas/source.schema.json "examples/ai-coding-assistant-evidence/sources.jsonl"
          python - <<'PY'
          import json
          from pathlib import Path
          for path in Path('schemas/vNext').glob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
          print('vNext schema JSON smoke OK')
          PY

  upload-build:
    name: upload-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build upload package
        run: bash packaging/make_upload.sh
      - name: SKILL.md parity
        run: diff -u SKILL.md dist/eduevidence-submission/SKILL.md
      - name: Zero-leak scan
        run: |
          set -euo pipefail
          submission=dist/eduevidence-submission
          test ! -e "$submission/docs/competition-brief.md"
          test ! -e "$submission/docs/superpowers"
          test ! -e "$submission/benchmarks/baselines"
          test ! -e "$submission/packaging"
          if find "$submission" -name '*副本*' | grep -q .; then
            echo "::error::macOS copy artifacts leaked into submission package"
            exit 1
          fi
          if grep -rIl '壁仞' "$submission" | grep -q .; then
            echo "::error::local competition brief content leaked into submission package"
            exit 1
          fi
          if grep -rIl 'interndiscovery@pjlab.org.cn' "$submission" | grep -q .; then
            echo "::error::local competition brief content leaked into submission package"
            exit 1
          fi
          echo "zero-leak scan OK"
