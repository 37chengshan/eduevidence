name: Studio Workspace
on:
  pull_request:
    paths: ['.github/workflows/studio-workspace.yml']
permissions:
  contents: read
jobs:
  workspace:
    if: github.head_ref == 'feature/research-studio-redesign'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Export tracked source and build tools
        run: |
          mkdir -p /tmp/studio-export /tmp/studio-tools
          git archive HEAD --format=tar.gz -o /tmp/studio-export/source.tar.gz
          cd /tmp/studio-tools
          npm init -y
          npm install --save-exact react@19 react-dom@19 @tanstack/react-query@5 lucide-react@0.468.0
          npm install --save-dev --save-exact typescript@5 vite@6 @types/react@19 @types/react-dom@19 @playwright/test@1.55.0 @axe-core/playwright@4
          tar czf /tmp/studio-export/toolchain.tar.gz package.json package-lock.json node_modules
      - uses: actions/upload-artifact@v4
        with:
          name: studio-development-workspace
          path: /tmp/studio-export/*
          retention-days: 1
