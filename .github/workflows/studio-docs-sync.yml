name: Synchronize Studio documentation
on:
  pull_request:
    paths: ['.github/workflows/studio-docs-sync.yml']
permissions:
  contents: write
jobs:
  docs:
    if: github.head_ref == 'feature/research-studio-redesign' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Synchronize read-only Studio usage
        run: |
          python - <<'PY'
          from pathlib import Path
          old = '**Local Web Studio** (`python3 scripts/dashboard_server.py --port 8765`) has exactly three read-only views: Dashboard, Report Browser and Data Visualization. It loads ECharts 5.4.3 from jsDelivr for interactive charts; the submission package does not bundle that runtime, so Web interactivity requires network access. The baked report\'s static HTML/SVG remains the offline artifact.'
          en = '''**Research Studio** is a read-only research workspace. Start `python3 scripts/dashboard_server.py --port 8765` and open `/studio/` to inspect projects, evidence, sources, recorded runs, committed revisions and five report identities. Skill Autoevolve has a separate observation view; the console cannot start research, mutate evidence or dispatch agents.

          The React + TypeScript frontend ships as static assets: Node is needed only for development, not for running the packaged Skill. Its charts do not depend on a remote ECharts CDN and never compute a pooled effect in the browser. Local research remains local; GitHub Pages exports public example packs only. Report themes are generated from complete bilingual inputs with explicit missing-data states, not fabricated fallback claims.

          See [Research Studio workflow and delivery guide](docs/research-studio-guide.zh-CN.md).'''
          zh = '''**Research Studio 研究观察台**保持只读。运行 `python3 scripts/dashboard_server.py --port 8765`，打开 `/studio/`，即可查看研究项目、证据与来源、实际运行记录、已提交版本及五种风格报告。Skill 自进化实验单独展示；控制台不会启动研究、修改证据或派发代理。

          控制台采用 React + TypeScript，分发包已包含静态资源，使用者无需安装 Node。新图表不依赖远程 ECharts CDN，也不在浏览器中计算合并效应量。本地研究不会进入 GitHub Pages 公共导出。五主题从完整双语输入生成，缺失内容明确标记，不补造结论。

          详见[研究观察台流程与交付指南](docs/research-studio-guide.zh-CN.md)。'''
          for name, replacement in [('README.md', en), ('README.zh-CN.md', zh)]:
              p=Path(name); s=p.read_text(); assert s.count(old)==1, name
              s=s.replace(old,replacement)
              s=s.replace('the optional Web Studio chart enhancement has a separate browser dependency.', 'legacy ECharts enhancement is optional and is not required by the new Research Studio.')
              s=s.replace('752 test functions / 73 files — docs/metrics.json', 'current counts in docs/metrics.json')
              p.write_text(s)
          p=Path('SKILL.md'); s=p.read_text()
          s=s.replace('Treat ECharts as an optional browser runtime used by the Web Studio, not as part of the core adapter contract.', 'Treat ECharts option data as an adapter format. Legacy browser enhancement is optional; the read-only Research Studio uses bundled React/SVG rendering and does not require a remote ECharts runtime.')
          start=s.index('## 19. Use the Local Web Studio Only as an Inspection Surface')
          end=s.index('\n---\n',start)
          s=s[:start]+'''## 19. Use Research Studio Only as an Inspection Surface
          Start the read-only local research workspace:
          ```bash
          python3 scripts/dashboard_server.py --host 127.0.0.1 --port 8765
          ```
          Open `http://127.0.0.1:8765/studio/`. Inspect local Projects, recorded Runs, staging/committed artifacts, Evidence Graph relationships, revision ancestry and generated reports. Keep project research iterations separate from Skill Autoevolve experiments.
          Do not route scientific reasoning or research mutations through the console. It cannot create studies, dispatch workers, stop runs, approve pilots or write canonical research state. Search, filtering, language and appearance controls change browser state only.
          Display missing artifacts, partial uncertainty and stale DecisionSnapshots explicitly. Never invent a conclusion, scientific gate result, progress percentage or pooled effect to fill a screen. Only show report variants that actually exist.
          Use `scripts/build_report_variants.py` during build to generate the five existing report identities from complete bilingual inputs. Preserve independent offline HTML, source provenance and scientific content across themes.
          Ship the prebuilt `web/studio/` resources with the Skill; Node is a development dependency only. Export public examples, never private `EDUEVIDENCE_HOME` research state, to static hosting. See `docs/research-studio-guide.zh-CN.md` for workflow and delivery contracts.
          '''+s[end:]
          p.write_text(s)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README.zh-CN.md SKILL.md
          git commit -m 'docs: align Skill entrypoint and README with read-only Research Studio'
      - name: Push reviewed documentation to feature branch only
        env:
          PUSH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          expected='${{ github.event.pull_request.head.sha }}'
          current=$(git ls-remote https://github.com/37chengshan/eduevidence.git refs/heads/feature/research-studio-redesign | cut -f1)
          test "$current" = "$expected"
          auth=$(printf 'x-access-token:%s' "$PUSH_TOKEN" | base64 -w0)
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" push https://github.com/37chengshan/eduevidence.git HEAD:refs/heads/feature/research-studio-redesign
