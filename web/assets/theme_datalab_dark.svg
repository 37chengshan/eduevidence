<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="dlDarkBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#05080E"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      @keyframes neonNodePulse {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 3px #F24D29); }
        50% { transform: scale(1.18); filter: drop-shadow(0 0 8px #F24D29); }
      }
      @keyframes graphLineFlow {
        0% { stroke-dashoffset: 16; }
        100% { stroke-dashoffset: 0; }
      }
      .anim-neon-node { transform-origin: 100px 145px; animation: neonNodePulse 2.2s infinite ease-in-out; }
      .anim-flow-line { stroke-dasharray: 4,3; animation: graphLineFlow 1.5s infinite linear; }
    </style>
  </defs>
  
  <rect width="600" height="450" fill="url(#dlDarkBg)"/>
  
  <!-- Topbar -->
  <g transform="translate(40, 20)">
    <circle cx="6" cy="6" r="3.5" fill="#EF4444"/>
    <circle cx="18" cy="6" r="3.5" fill="#F59E0B"/>
    <circle cx="30" cy="6" r="3.5" fill="#10B981"/>
    <text x="46" y="9" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">eduevidence-terminal // CS1 Coding Assistants (N=50)</text>
    <rect x="380" y="-3" width="140" height="18" rx="3" fill="#1E293B"/>
    <text x="450" y="9" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="8" text-anchor="middle">MODE: AGENT MCP</text>
  </g>
  
  <!-- Top Telemetry Box (520px wide) -->
  <g transform="translate(40, 48)">
    <rect width="520" height="65" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    <text x="14" y="20" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700">RANDOM EFFECTS ESTIMATE (DerSimonian-Laird)</text>
    <text x="14" y="48" fill="#38BDF8" font-family="'JetBrains Mono', monospace" font-size="20" font-weight="800" filter="url(#neonGlow)">+0.58 g</text>
    <text x="130" y="48" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">95% CI: [+0.42, +0.74]</text>
    <text x="360" y="48" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="10">I² = 38.4%</text>
  </g>
  
  <!-- Bottom Combined Box: Graph + 13 Schema Gates (520px wide) -->
  <g transform="translate(40, 122)">
    <rect width="520" height="210" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
    
    <!-- Left Mini Graph (x=10 to x=220) -->
    <g transform="translate(10, 10)">
      <text x="10" y="14" fill="#F8FAFC" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">SSOT EVIDENCE GRAPH</text>
      
      <!-- Lines -->
      <g stroke="#38BDF8" stroke-width="1" opacity="0.8">
        <line class="anim-flow-line" x1="100" y1="38" x2="50" y2="80"/>
        <line class="anim-flow-line" x1="100" y1="38" x2="150" y2="80"/>
        <line x1="50" y1="80" x2="35" y2="120"/>
        <line x1="50" y1="80" x2="75" y2="120"/>
        <line x1="150" y1="80" x2="135" y2="120"/>
        <line x1="150" y1="80" x2="175" y2="120"/>
        <line class="anim-flow-line" x1="35" y1="120" x2="100" y2="150"/>
        <line class="anim-flow-line" x1="75" y1="120" x2="100" y2="150"/>
        <line class="anim-flow-line" x1="135" y1="120" x2="100" y2="150"/>
        <line class="anim-flow-line" x1="175" y1="120" x2="100" y2="150"/>
      </g>
      
      <!-- Nodes -->
      <circle cx="100" cy="38" r="10" fill="#F24D29" filter="url(#neonGlow)"/>
      <text x="100" y="41" fill="#FFFFFF" font-family="sans-serif" font-size="7" font-weight="bold" text-anchor="middle">CS1</text>
      
      <circle cx="50" cy="80" r="8" fill="#38BDF8"/>
      <text x="50" y="83" fill="#0B0F17" font-family="sans-serif" font-size="6.5" font-weight="bold" text-anchor="middle">+0.64</text>
      
      <circle cx="150" cy="80" r="8" fill="#F59E0B"/>
      <text x="150" y="83" fill="#0B0F17" font-family="sans-serif" font-size="6.5" font-weight="bold" text-anchor="middle">-0.28</text>
      
      <circle cx="35" cy="120" r="5" fill="#10B981"/>
      <circle cx="75" cy="120" r="5" fill="#10B981"/>
      <circle cx="135" cy="120" r="5" fill="#EF4444"/>
      <circle cx="175" cy="120" r="5" fill="#EF4444"/>
      
      <circle class="anim-neon-node" cx="100" cy="150" r="12" fill="#F24D29" stroke="#FFFFFF" stroke-width="1.2" filter="url(#neonGlow)"/>
      <text x="100" y="153" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="7" font-weight="bold" text-anchor="middle">PILOT</text>
    </g>
    
    <!-- Vertical Divider -->
    <line x1="230" y1="12" x2="230" y2="198" stroke="#1E293B" stroke-width="1"/>
    
    <!-- Right 13 Schema Gates (x=245 to x=505) -->
    <g transform="translate(245, 10)" font-family="'JetBrains Mono', monospace" font-size="8.5" fill="#F8FAFC">
      <text x="0" y="14" fill="#94A3B8" font-size="9" font-weight="700">13 SCHEMA GATES VERIFICATION</text>
      
      <text x="0" y="36">1. Frame Protocol</text>
      <rect x="140" y="28" width="115" height="9" rx="2" fill="#10B981"/>
      
      <text x="0" y="58">2. Retrieval Gate</text>
      <rect x="140" y="50" width="115" height="9" rx="2" fill="#10B981"/>
      
      <text x="0" y="80">3. WWC 5.0 Audit</text>
      <rect x="140" y="72" width="115" height="9" rx="2" fill="#38BDF8"/>
      
      <text x="0" y="102">4. Causal Loop</text>
      <rect x="140" y="94" width="115" height="9" rx="2" fill="#F24D29"/>
      
      <text x="0" y="124">5. Diff Redecide</text>
      <rect x="140" y="116" width="115" height="9" rx="2" fill="#10B981"/>
      
      <rect x="0" y="145" width="255" height="24" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="0.8"/>
      <text x="127" y="160" fill="#38BDF8" font-size="8.5" font-weight="bold" text-anchor="middle">[SYSTEM VERIFIED: 100% OK]</text>
    </g>
  </g>
</svg>
