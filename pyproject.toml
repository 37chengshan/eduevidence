[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "eduevidence"
version = "2.0.0"
description = "Evidence-Based AI Teaching Decision & Intervention Skill — from education questions to evidence-based decisions."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "EduEvidence Contributors" }]
keywords = ["education", "evidence", "skill", "evidence-based", "teaching", "ai-education"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Education",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
eduevidence = "eduevidence_cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"

# wheel 分发 CLI（eduevidence_cli）+ engine 包（V2 命令依赖）；Skill 本体
# （SKILL.md + skill/ + references/ + schemas/ + scripts/ + retrieval/ +
# integrations/ + visualization/ + assets/）由 install.sh 或源码包完整分发。
[tool.setuptools]
py-modules = ["eduevidence_cli"]
packages = ["engine"]
